[package]
name = "ocs-pointcloud-clip"
version = "0.1.0"
edition = "2021"
description = "Progressive point cloud clipping for Open CAD Studio"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio.git", features = ["host"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
